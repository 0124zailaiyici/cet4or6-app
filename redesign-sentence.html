<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>💬 句子拼图 - 四级备考</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#fef8f0;
  --surface:#fffcf8;
  --card:#ffffff;
  --border:#fde8d8;
  --text:#5a4040;
  --dim:#cfa88a;
  --accent:#fdba74;
  --accent2:#f97316;
  --accent-dim:#fef0e0;
  --accent-glow:rgba(253,186,116,.25);
  --green:#86efac;
  --amber:#fbbf24;
  --violet:#c4b5fd;
  --pink:#ff8fab;
}
body{
  font-family:'Noto Sans SC','Fredoka',sans-serif;
  background:#f5e8dc;color:var(--text);min-height:100vh;
  display:flex;justify-content:center;align-items:center;padding:20px;
}
.phone{
  width:390px;min-height:780px;
  background:var(--surface);border-radius:40px;padding:20px 16px;position:relative;
  box-shadow:0 8px 40px rgba(253,186,116,.12),inset 0 0 0 1px var(--border);
  overflow:hidden;
}
.phone::before{
  content:'';position:absolute;top:12px;left:50%;transform:translateX(-50%);
  width:130px;height:5px;background:#f0d6c8;border-radius:3px;z-index:10;
}
.header{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 0 16px;border-bottom:2px solid var(--border);margin-top:4px;
}
.header h1{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px;font-family:'Fredoka',sans-serif}
.header h1 span{color:var(--accent2)}
.header-info{display:flex;gap:12px;font-size:12px}
.header-info .stat{display:flex;align-items:center;gap:5px;color:var(--dim);background:var(--accent-dim);padding:4px 12px;border-radius:20px;font-weight:500}
.header-info .stat .num{color:var(--accent2);font-weight:700;font-family:'Fredoka',sans-serif}
.mode-select{display:flex;gap:8px;margin:16px 0}
.mode-btn{flex:1;padding:10px;border-radius:12px;background:#fff;border:2px solid var(--border);color:var(--dim);font-size:12px;font-weight:600;cursor:pointer;text-align:center;transition:all .25s;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:4px}
.mode-btn .emoji{font-size:22px}
.mode-btn.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent2)}
.mode-btn:hover{border-color:var(--accent)}
.level-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 14px;background:var(--accent-dim);border-radius:20px;font-size:12px;color:var(--accent2);font-weight:600}
.game-bar{display:flex;justify-content:space-between;align-items:center;padding:12px 0}
.game-bar .timer{font-family:'Fredoka',sans-serif;font-weight:700;font-size:24px;display:flex;align-items:center;gap:8px}
.game-bar .timer .clock{font-size:20px}
.game-bar .timer.urgent{color:var(--accent2)}
.game-bar .score{font-family:'Fredoka',sans-serif;font-weight:700;font-size:22px;color:var(--amber)}
.puzzle-area{background:#fff;border-radius:20px;padding:20px 16px;border:2px solid var(--border);margin-bottom:12px;position:relative;min-height:320px}
.puzzle-area .hint{font-size:13px;color:var(--dim);text-align:center;margin-bottom:12px;padding:10px 14px;background:var(--bg);border-radius:12px}
.puzzle-area .hint .cn{color:var(--accent2);font-weight:600;margin-top:4px;font-size:15px}
.drop-zone{min-height:56px;background:var(--bg);border:2px dashed var(--border);border-radius:14px;padding:10px;display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;transition:border-color .3s}
.drop-zone .chip{padding:6px 16px;background:var(--accent-dim);border:2px solid var(--accent);border-radius:10px;font-size:14px;font-weight:500;cursor:pointer;transition:all .2s;animation:chipPop .3s ease}
.drop-zone .chip:hover{background:#fed7aa}
.drop-zone.filled{border-color:var(--green);background:#f0fdf4}
.word-bank{display:flex;flex-wrap:wrap;gap:8px;padding:8px 0;min-height:50px}
.word-bank .chip{padding:8px 18px;background:#fff;border:2px solid var(--border);border-radius:12px;font-size:14px;cursor:pointer;transition:all .2s;user-select:none;border-left:4px solid var(--violet)}
.word-bank .chip:hover{background:var(--accent-dim);border-color:var(--accent);transform:translateY(-2px)}
.word-bank .chip:active{transform:scale(.95)}
.word-bank .chip.used{opacity:.25;pointer-events:none;transform:scale(.9)}
.stars-row{display:flex;gap:4px;justify-content:center;margin:12px 0 0;height:24px}
.stars-row .star{font-size:22px;color:var(--border);transition:all .4s}
.stars-row .star.lit{color:var(--amber);text-shadow:0 0 12px rgba(251,191,36,.4)}
.controls{display:flex;gap:8px;margin-top:12px}
.control-btn{flex:1;padding:12px;border-radius:12px;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:all .25s;font-family:inherit}
.control-btn.check{background:var(--accent);color:#fff;box-shadow:0 4px 16px var(--accent-glow)}
.control-btn.check:hover{transform:translateY(-2px)}
.control-btn.reset{background:var(--bg);color:var(--dim);border:2px solid var(--border)}
.control-btn.reset:hover{color:var(--text);border-color:var(--accent)}
.control-btn.skip{background:var(--bg);color:var(--dim);border:2px solid var(--border)}
.control-btn.skip:hover{color:var(--text)}
.streak{text-align:center;font-size:13px;padding:8px 0 4px;color:var(--dim);min-height:28px}
.streak .fire{color:var(--accent2);font-weight:700}
.result-overlay{
  display:none;position:absolute;inset:0;background:rgba(255,252,248,.97);border-radius:40px;z-index:20;
  flex-direction:column;align-items:center;justify-content:center;padding:40px;
}
.result-overlay.show{display:flex}
.result-overlay .big-icon{font-size:72px;margin-bottom:12px}
.result-overlay h2{font-size:26px;font-weight:700;margin-bottom:4px}
.result-overlay .sub{color:var(--dim);font-size:14px;margin-bottom:20px}
.result-overlay .stats-row{display:flex;gap:20px;margin-bottom:24px}
.result-overlay .stats-row .item{text-align:center}
.result-overlay .stats-row .item .num{font-family:'Fredoka',sans-serif;font-size:30px;font-weight:700}
.result-overlay .stats-row .item .label{font-size:11px;color:var(--dim);margin-top:2px}
.btn{padding:14px 40px;border-radius:30px;border:none;font-size:16px;font-weight:600;cursor:pointer;transition:all .3s;font-family:inherit}
.btn-primary{background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;box-shadow:0 4px 20px var(--accent-glow)}
.btn-primary:hover{transform:translateY(-2px)}
.btn-secondary{background:var(--bg);color:var(--dim);border:2px solid var(--border)}
@keyframes chipPop{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .4s ease}
.scrollable{max-height:580px;overflow-y:auto;padding-right:4px}
.scrollable::-webkit-scrollbar{width:4px}
.scrollable::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
</style>
</head>
<body>
<div class="phone">
  <div class="header">
    <h1><span>💬</span> 句子拼图</h1>
    <div class="header-info"><span class="stat">🏆 <span class="num">Lv.3</span></span><span class="stat">🔥 <span class="num">5</span></span></div>
  </div>
  <div class="scrollable">
    <div class="mode-select">
      <button class="mode-btn active"><span class="emoji">🧩</span>拼图模式</button>
      <button class="mode-btn"><span class="emoji">🎯</span>限时挑战</button>
      <button class="mode-btn"><span class="emoji">⚔️</span>双人对战</button>
    </div>
    <div class="level-badge">🌱 Easy · 日常对话</div>
    <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0">
      <div style="font-size:12px;color:var(--dim)">第 3/8 题</div>
      <div style="display:flex;gap:4px">
        <span style="color:var(--green)">●</span><span style="color:var(--green)">●</span><span style="color:var(--accent2)">●</span>
        <span style="color:var(--dim)">○</span><span style="color:var(--dim)">○</span><span style="color:var(--dim)">○</span>
      </div>
    </div>
    <div class="game-bar">
      <div class="timer"><span class="clock">⏱️</span><span id="timerDisplay">0:18</span></div>
      <div class="score" id="scoreDisplay">★ 180</div>
    </div>
    <div class="puzzle-area" id="puzzleArea">
      <div class="hint">请将下面的单词拼成正确的英文句子<div class="cn">你觉得这个项目怎么样？</div></div>
      <div class="drop-zone" id="dropZone"></div>
      <div class="word-bank" id="wordBank">
        <div class="chip" onclick="moveToDrop(this)">about</div>
        <div class="chip" onclick="moveToDrop(this)">do</div>
        <div class="chip" onclick="moveToDrop(this)">What</div>
        <div class="chip" onclick="moveToDrop(this)">think</div>
        <div class="chip" onclick="moveToDrop(this)">you</div>
        <div class="chip" onclick="moveToDrop(this)">this</div>
        <div class="chip" onclick="moveToDrop(this)">project</div>
        <div class="chip" onclick="moveToDrop(this)">?</div>
      </div>
      <div class="stars-row" id="starsRow"><span class="star">★</span><span class="star">★</span><span class="star">★</span></div>
      <div class="controls">
        <button class="control-btn reset" onclick="resetPuzzle()">🔄 重置</button>
        <button class="control-btn check" onclick="checkAnswer()">✓ 检查</button>
        <button class="control-btn skip" onclick="skipPuzzle()">⏭️ 跳过</button>
      </div>
      <div class="streak" id="streakDisplay">连击: <span class="fire">🔥 x3</span></div>
    </div>
    <div style="display:flex;gap:8px;padding:4px 0">
      <div style="flex:1;text-align:center;padding:10px;background:#fff;border-radius:12px;border:2px solid var(--border)">
        <div style="font-size:18px;font-weight:700;color:var(--green);font-family:Fredoka,sans-serif">6</div>
        <div style="font-size:10px;color:var(--dim)">已完成</div>
      </div>
      <div style="flex:1;text-align:center;padding:10px;background:#fff;border-radius:12px;border:2px solid var(--border)">
        <div style="font-size:18px;font-weight:700;color:var(--amber);font-family:Fredoka,sans-serif">83%</div>
        <div style="font-size:10px;color:var(--dim)">正确率</div>
      </div>
      <div style="flex:1;text-align:center;padding:10px;background:#fff;border-radius:12px;border:2px solid var(--border)">
        <div style="font-size:18px;font-weight:700;color:var(--accent2);font-family:Fredoka,sans-serif">12s</div>
        <div style="font-size:10px;color:var(--dim)">平均用时</div>
      </div>
    </div>
  </div>
  <div class="result-overlay" id="resultOverlay">
    <div class="big-icon">🏆</div>
    <h2>关卡完成！</h2>
    <div class="sub">Easy 日常对话 · 8/8 拼图完成</div>
    <div class="stats-row">
      <div class="item"><div class="num" style="color:var(--green)">6</div><div class="label">正确</div></div>
      <div class="item"><div class="num" style="color:var(--accent2)">2</div><div class="label">跳过</div></div>
      <div class="item"><div class="num" style="color:var(--amber)">580</div><div class="label">得分</div></div>
    </div>
    <button class="btn btn-primary" onclick="closeResult()">解锁 Medium 难度 🚀</button>
    <button class="btn btn-secondary" style="margin-top:8px" onclick="closeResult()">再来一轮</button>
  </div>
</div>
<script>
const wordBank=document.getElementById('wordBank'),dropZone=document.getElementById('dropZone');
let currentPuzzle=0,streak=3,score=180,timer=18,timerInterval;
function moveToDrop(chip){
  if(chip.classList.contains('used'))return;chip.classList.add('used');
  const nc=document.createElement('div');nc.className='chip';nc.textContent=chip.textContent;
  nc.onclick=function(){moveToBank(nc)};dropZone.appendChild(nc);
  dropZone.classList.toggle('filled',dropZone.children.length>=4);
}
function moveToBank(chip){chip.remove();dropZone.classList.toggle('filled',dropZone.children.length>=4);const orig=Array.from(wordBank.children).find(c=>c.textContent===chip.textContent&&c.classList.contains('used'));if(orig)orig.classList.remove('used')}
function checkAnswer(){
  const chips=dropZone.querySelectorAll('.chip');const answer=Array.from(chips).map(c=>c.textContent).join(' ');
  const correct="What do you think about this project ?";
  if(answer.replace(/\s+/g,' ').trim()===correct.replace(/\s+/g,' ').trim()){
    dropZone.style.borderColor='var(--green)';streak++;score+=20+streak*10;
    document.getElementById('scoreDisplay').textContent=`★ ${score}`;
    document.getElementById('streakDisplay').innerHTML=`连击: <span class="fire">🔥 x${streak}</span>`;
    const stars=document.querySelectorAll('#starsRow .star');
    for(let s of stars){if(!s.classList.contains('lit')){s.classList.add('lit');break}}
    setTimeout(nextPuzzle,800);
  }else{
    wordBank.closest('.puzzle-area').classList.add('shake');setTimeout(()=>wordBank.closest('.puzzle-area').classList.remove('shake'),400);
    streak=0;document.getElementById('streakDisplay').innerHTML=`连击: <span class="fire">🔥 x0</span>`;
    score=Math.max(0,score-10);document.getElementById('scoreDisplay').textContent=`★ ${score}`;
  }
}
function resetPuzzle(){const chips=dropZone.querySelectorAll('.chip');chips.forEach(c=>{const orig=Array.from(wordBank.children).find(w=>w.textContent===c.textContent&&w.classList.contains('used'));if(orig)orig.classList.remove('used')});dropZone.innerHTML='';dropZone.classList.remove('filled');dropZone.style.borderColor=''}
function skipPuzzle(){nextPuzzle()}
function nextPuzzle(){
  resetPuzzle();const puzzles=[
    {hint:'你觉得这个项目怎么样？',answer:'What do you think about this project ?',words:['What','do','you','think','about','this','project','?']},
    {hint:'我完全同意你的观点。',answer:'I completely agree with your point .',words:['I','completely','agree','with','your','point','.']},
    {hint:'你能帮我一个忙吗？',answer:'Could you do me a favor ?',words:['Could','you','do','me','a','favor','?']},
  ];const p=puzzles[currentPuzzle%puzzles.length];
  document.querySelector('.hint .cn').textContent=p.hint;
  wordBank.innerHTML='';const shuffled=[...p.words].sort(()=>Math.random()-.5);
  shuffled.forEach(w=>{const chip=document.createElement('div');chip.className='chip';chip.textContent=w;chip.onclick=function(){moveToDrop(this)};wordBank.appendChild(chip)});
  currentPuzzle++;timer=18;updateTimerDisplay();
}
function updateTimerDisplay(){document.getElementById('timerDisplay').textContent=`0:${timer.toString().padStart(2,'0')}`;document.querySelector('.timer').classList.toggle('urgent',timer<=5)}
function startTimer(){timerInterval=setInterval(()=>{timer--;updateTimerDisplay();if(timer<=0)skipPuzzle()},1000)}
function closeResult(){
  document.getElementById('resultOverlay').classList.remove('show');
  streak=3;score=180;document.getElementById('scoreDisplay').textContent='★ 180';
  document.getElementById('streakDisplay').innerHTML='连击: <span class="fire">🔥 x3</span>';
  document.querySelectorAll('#starsRow .star').forEach(s=>s.classList.remove('lit'));currentPuzzle=0;nextPuzzle();
}
startTimer();
</script>
</body>
</html>
