# ===== LifeWise =====
server {
    listen 80;
    server_name 47.106.126.50;

    # API proxy (for frontend requests from /api)
    location /api/ {
        proxy_pass http://localhost:8082/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Uploads proxy
    location /uploads/ {
        proxy_pass http://localhost:8082/uploads/;
        proxy_set_header Host $host;
    }

    # Food image proxy
    location /food-image/ {
        proxy_pass http://localhost:8082/food-image/;
        proxy_set_header Host $host;
    }

    # LifeWise frontend
    location /lifewise/ {
        root /var/www;
        index index.html;
        try_files $uri $uri/ /lifewise/index.html;
    }
    location /lifewise/api/ {
        proxy_pass http://localhost:8082/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
    location /lifewise/uploads/ {
        proxy_pass http://localhost:8082/uploads/;
        proxy_set_header Host $host;
    }
    location /lifewise/assets/ {
        root /var/www;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }


    location /pose-api/ {
        proxy_pass http://127.0.0.1:8091/pose-api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        client_max_body_size 8M;
    }
    # PoseGuide frontend
    location / {
        root /opt/pose-guide;
        index index.html;
        try_files $uri $uri/ =404;
    }
}

server {
    listen 443 ssl;
    server_name 47.106.126.50;
    ssl_certificate /opt/pose-guide/server.crt;
    ssl_certificate_key /opt/pose-guide/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/pose-guide;
    index index.html;

    location /cet4/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        client_max_body_size 2M;
    }

    location /pose-api/ {
        proxy_pass http://127.0.0.1:8091/pose-api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        client_max_body_size 8M;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
