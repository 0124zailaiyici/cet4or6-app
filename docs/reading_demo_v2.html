<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>阅读理解优化原型 - 手机端</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

/* 手机框 */
body { background: #0d1117; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
.phone-frame {
  width: 390px; height: 844px; background: #f3eeed; border-radius: 36px;
  overflow: hidden; box-shadow: 0 0 0 8px #1a1a1a, 0 0 0 10px #333, 0 20px 60px rgba(0,0,0,0.6);
  display: flex; flex-direction: column; position: relative;
}
.phone-status { height: 44px; background: #f3eeed; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.phone-notch { width: 120px; height: 6px; border-radius: 3px; background: #d0c8d0; }

/* ===== 顶部导航 ===== */
.topbar {
  display: flex; align-items: center; gap: 10rpx;
  padding: 8px 16px; flex-shrink: 0;
  /* rpx → px: 小程序 1rpx ≈ 屏幕宽度/750, 在390px屏上1rpx≈0.52px */
}
.tb-back {
  padding: 4px 12px; height: 34px; border-radius: 8px; background: rgba(84,110,122,0.08);
  font-size: 13px; color: #546e7a; cursor: pointer; border: none; display: flex; align-items: center;
}
.tb-title { flex: 1; font-size: 15px; font-weight: 700; color: #2d2d4e; }
.tb-badge { font-size: 10px; color: #fff; padding: 3px 10px; border-radius: 8px; background: linear-gradient(135deg, #81c784, #388e3c); }
.tb-mode { font-size: 10px; color: #8b95a5; padding: 3px 8px; background: rgba(0,0,0,0.05); border-radius: 6px; cursor: pointer; border: none; }

/* ===== 文章区 ===== */
.pass-zone {
  flex: 1; display: flex; flex-direction: column; padding: 0 12px; min-height: 0; overflow: hidden;
}
.pz-scroll {
  flex: 1; overflow-y: auto; background: #eef1f3; border-radius: 12px; padding: 14px 16px;
  font-size: 14px; line-height: 1.9; color: #2d3a4a;
}
.pz-scroll::-webkit-scrollbar { width: 0; }

/* 段落 */
.para { margin-bottom: 14px; padding: 10px 12px; border-radius: 8px; border-left: 3px solid transparent; transition: 0.3s; position: relative; }
.para-label {
  display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 700;
  background: #d0d8e0; color: #546e7a; margin-right: 6px; vertical-align: middle;
}
.para.highlight { background: rgba(56,142,60,0.08); border-left-color: #388e3c; }
.para.highlight .para-label { background: #388e3c; color: #fff; }
.para.highlight2 { background: rgba(30,136,229,0.06); border-left-color: #64b5f6; }

/* 难词 */
.word-badge {
  display: inline; color: #e65100; border-bottom: 1px dashed #e65100; cursor: pointer; position: relative;
  transition: 0.15s; font-weight: 500;
}
.word-badge.active { background: #e65100; color: #fff; border-radius: 3px; padding: 0 2px; }

/* 文章内关键词高亮 */
.pass-kw { background: rgba(30,136,229,0.15); border-radius: 2px; padding: 0 1px; }

/* 段落页脚提示 */
.para-hint {
  display: none; font-size: 10px; color: #388e3c; margin-top: 4px; font-style: italic;
}
.para.highlight .para-hint { display: block; }

/* 分页点 */
.pz-nav { display: flex; justify-content: center; align-items: center; gap: 6px; padding: 4px 0 2px; flex-shrink: 0; }
.pz-dots { display: flex; gap: 4px; }
.pzd { width: 6px; height: 6px; border-radius: 50%; background: #d0c8d0; }
.pzd.on { background: #546e7a; width: 14px; border-radius: 3px; }
.pz-num { font-size: 10px; color: #8a7a9a; }

/* 分割线 */
.divider { height: 1px; background: #dad0ca; flex-shrink: 0; }

/* ===== 题目区 ===== */
.quest-zone {
  flex: 1.2; display: flex; flex-direction: column; padding: 0 12px 12px; min-height: 0; overflow: hidden;
  background: #f7f0ef;
}
.qz-header { display: flex; justify-content: space-between; align-items: center; padding: 6px 0 2px; flex-shrink: 0; }
.qz-label { font-size: 11px; font-weight: 600; color: #546e7a; }
.qz-hint { font-size: 10px; color: #8a7a9a; }
.qz-scroll { flex: 1; overflow-y: auto; min-height: 0; }
.qz-scroll::-webkit-scrollbar { width: 0; }

/* 题目卡片 */
.q-card {
  background: #fff; border-radius: 12px; padding: 14px 16px; margin-bottom: 10px;
  box-shadow: 0 1px 8px rgba(84,110,122,0.04); cursor: pointer; transition: 0.2s;
  border: 2px solid transparent;
}
.q-card.active { border-color: #81c784; box-shadow: 0 2px 16px rgba(56,142,60,0.1); }
.q-card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.q-num {
  width: 24px; height: 24px; border-radius: 6px; background: #eef1f3;
  font-size: 12px; font-weight: 700; color: #546e7a;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.q-card.active .q-num { background: #388e3c; color: #fff; }
.q-locate { font-size: 10px; padding: 2px 8px; border-radius: 4px; background: rgba(56,142,60,0.08); color: #388e3c; }
.q-stem { font-size: 13px; line-height: 1.6; color: #2d2d4e; margin-bottom: 6px; }
.q-stem b { color: #e65100; font-weight: 600; }
.q-keywords { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 6px; }
.q-kw { font-size: 10px; padding: 2px 8px; border-radius: 8px; background: rgba(30,136,229,0.08); color: #1e88e5; }

/* 解题思路 - 折叠 */
.q-diff {
  font-size: 11px; color: #6a7a8a; line-height: 1.6; margin-top: 4px;
  padding: 8px 10px; border-radius: 6px; background: rgba(0,0,0,0.02);
  display: none; max-height: 0; overflow: hidden; transition: 0.3s;
}
.q-card.active .q-diff { display: block; max-height: 300px; }
.q-diff b { color: #e65100; }

/* 选项 */
.q-options { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; }
.q-opt {
  padding: 8px 10px; border-radius: 8px; font-size: 11px; color: #4a4a6a;
  background: #faf7f6; border: 1px solid #ece4e2;
}
.q-opt.correct { border-color: #81c784; background: rgba(129,199,132,0.08); color: #2e7d32; font-weight: 600; }
.q-opt.wrong { border-color: #e57373; background: rgba(229,115,115,0.06); color: #c62828; text-decoration: line-through; }

/* ===== 底部导航 ===== */
.btm-nav { display: flex; gap: 6px; padding: 6px 12px 8px; flex-shrink: 0; }
.btm-btn {
  flex: 1; padding: 8px; border-radius: 10px; border: none; font-size: 13px; font-weight: 600; cursor: pointer;
  color: #fff; transition: 0.15s;
}
.btm-btn.submit { background: linear-gradient(135deg, #1e88e5, #1565c0); }
.btm-btn.show-all { background: linear-gradient(135deg, #78909c, #455a64); }

/* ===== 词汇弹窗 ===== */
.word-modal {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 100;
  display: none; justify-content: center; align-items: flex-end;
}
.word-modal.show { display: flex; }
.word-card {
  width: 100%; max-width: 390px; background: #fff; border-radius: 16px 16px 0 0;
  padding: 20px 24px 28px; animation: slideUp 0.25s ease;
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.word-en { font-size: 24px; font-weight: 700; color: #2d2d4e; }
.word-phonetic { font-size: 13px; color: #8a7a9a; margin: 4px 0 10px; }
.word-zh { font-size: 15px; color: #546e7a; margin-bottom: 8px; }
.word-note { font-size: 12px; color: #8a7a9a; line-height: 1.6; }
.word-close {
  margin-top: 12px; width: 100%; padding: 10px; border-radius: 10px; border: none;
  background: #eef1f3; font-size: 14px; font-weight: 600; color: #546e7a; cursor: pointer;
}

/* 完整答案弹窗 */
.answer-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 100;
  display: none; justify-content: center; align-items: center;
}
.answer-overlay.show { display: flex; }
.answer-sheet {
  width: 340px; max-height: 80vh; background: #fff; border-radius: 16px;
  padding: 20px; overflow-y: auto; animation: fadeIn 0.2s ease;
}
@keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
.as-title { font-size: 16px; font-weight: 700; color: #2d2d4e; text-align: center; margin-bottom: 12px; }
.as-item { padding: 8px 0; border-bottom: 1px solid #f0f0f0; font-size: 12px; color: #546e7a; }
.as-item:last-child { border-bottom: none; }
.as-correct { color: #2e7d32; font-weight: 600; }
.as-close {
  margin-top: 12px; width: 100%; padding: 10px; border-radius: 10px; border: none;
  background: linear-gradient(135deg, #78909c, #455a64); font-size: 14px; color: #fff; cursor: pointer;
}

/* 提示切换按钮 */
.mode-toggle {
  position: fixed; top: 20px; right: 50%; transform: translateX(230px);
  padding: 6px 12px; border-radius: 6px; background: #23262d; color: #8b95a5;
  font-size: 11px; cursor: pointer; border: 1px solid #3a3f4a; z-index: 10;
}
</style>
</head>
<body>

<div class="phone-frame" id="phone-frame">
  <div class="phone-status"><div class="phone-notch"></div></div>

  <!-- 顶部导航 -->
  <div class="topbar">
    <button class="tb-back">← 返回</button>
    <span class="tb-title">仔细阅读</span>
    <span class="tb-badge">精读</span>
  </div>

  <!-- 文章区 -->
  <div class="pass-zone">
    <div class="pz-scroll" id="passage"></div>
    <div class="pz-nav">
      <div class="pz-dots" id="pz-dots"></div>
      <span class="pz-num" id="pz-num"></span>
    </div>
  </div>

  <div class="divider"></div>

  <!-- 题目区 -->
  <div class="quest-zone">
    <div class="qz-header">
      <span class="qz-label">❓ 题目（5题）</span>
      <span class="qz-hint">👆 点击题目 · 文章自动定位</span>
    </div>
    <div class="qz-scroll" id="questions"></div>
  </div>

  <!-- 底部按钮 -->
  <div class="btm-nav">
    <button class="btm-btn show-all" onclick="showAllAnswers()">📋 查看全部答案</button>
    <button class="btm-btn submit" onclick="submitAll()">✅ 提交批改</button>
  </div>
</div>

<!-- 词汇弹窗 -->
<div class="word-modal" id="word-modal" onclick="closeWordModal()">
  <div class="word-card" onclick="event.stopPropagation()">
    <div class="word-en" id="wm-en"></div>
    <div class="word-phonetic" id="wm-phonetic"></div>
    <div class="word-zh" id="wm-zh"></div>
    <div class="word-note" id="wm-note"></div>
    <button class="word-close" onclick="closeWordModal()">关闭</button>
  </div>
</div>

<!-- 答案汇总弹窗 -->
<div class="answer-overlay" id="answer-overlay" onclick="closeAnswerOverlay()">
  <div class="answer-sheet" onclick="event.stopPropagation()">
    <div class="as-title">📋 全部答案</div>
    <div id="answer-list"></div>
    <button class="as-close" onclick="closeAnswerOverlay()">关闭</button>
  </div>
</div>

<script>
// ===== 词汇表 =====
const vocab = {
  vow: { zh: 'n. 誓言，誓约', phonetic: '/vaʊ/', note: '文中"marriage vow" = 结婚誓约。经典搭配：exchange vows 交换誓言。' },
  spouse: { zh: 'n. 配偶', phonetic: '/spaʊs/', note: '可指丈夫或妻子，比 husband/wife 更正式。文中指生病的配偶。' },
  diagnosed: { zh: 'v. 诊断', phonetic: '/ˈdaɪəɡnəʊzd/', note: 'be diagnosed with + 疾病 = 被诊断患有某病。' },
  struggling: { zh: 'v. 挣扎，艰难应对', phonetic: '/ˈstrʌɡlɪŋ/', note: 'struggle with = 与...作斗争。文中指同时应对疾病和离婚压力。' },
  onset: { zh: 'n. 发生，开始', phonetic: '/ˈɒnset/', note: 'the onset of illness = 疾病的发作。CET-4 高频词。' },
  chronic: { zh: 'adj. 慢性的', phonetic: '/ˈkrɒnɪk/', note: '反义 acute (急性的)。chronic illness = 慢性病。' },
  vulnerable: { zh: 'adj. 脆弱的，易受伤的', phonetic: '/ˈvʌlnərəbl/', note: 'be vulnerable to = 易受...伤害。文中 doubly vulnerable = 双重脆弱。' },
  marital: { zh: 'adj. 婚姻的', phonetic: '/ˈmærɪtl/', note: 'marital status = 婚姻状况。marital break-up = 婚姻破裂。' },
  widowed: { zh: 'adj. 丧偶的', phonetic: '/ˈwɪdəʊd/', note: '动词 widow = 使丧偶。被动 be widowed = 成为寡妇/鳏夫。' },
  norms: { zh: 'n. 准则，规范', phonetic: '/nɔːmz/', note: 'social norms = 社会规范。gender norms = 性别规范/准则。' },
  caregiving: { zh: 'n. 看护，照料', phonetic: '/ˈkeəɡɪvɪŋ/', note: 'care + giving，照料他人的行为。文中指配偶间的互相照顾。' },
  prospective: { zh: 'adj. 潜在的，未来的', phonetic: '/prəˈspektɪv/', note: 'prospective partners = 潜在伴侣/未来可能成为伴侣的人。' },
  policymakers: { zh: 'n. 政策制定者', phonetic: '/ˈpɒləsɪmeɪkəz/', note: 'policy(政策) + maker(制定者)。文中指政府决策者。' },
  divorce: { zh: 'n./v. 离婚', phonetic: '/dɪˈvɔːs/', note: 'divorce rate = 离婚率。get divorced = 离婚（强调结果）。' },
};

// ===== 段落数据 =====
const passages = [
  {
    label: 'P1', loc: [46],
    raw: 'In the classic marriage <v>vow</v>, couples promise to stay together in sickness and in health. But a new study finds that the risk of <v>divorce</v> among older couples rises when the wife—not the husband—becomes seriously ill.',
    hint: '📍 Q46 在此：marriage vows → 离婚风险上升 = 誓约并不能保证婚姻持久',
  },
  {
    label: 'P2', loc: [],
    raw: '"Married women <v>diagnosed</v> with a serious health condition may find themselves <v>struggling</v> with the impact of their disease while also experiencing the stress of divorce," said researcher Amelia Karraker.',
  },
  {
    label: 'P3', loc: [],
    raw: 'Karraker and co-author Kenzie Latham analyzed 20 years of data on 2,717 marriages from a study conducted by Indiana University since 1992. At the time of the first interview, at least one of the partners was over the age of 50.',
  },
  {
    label: 'P4', loc: [47],
    raw: 'The researchers examined how the <v>onset</v> of four serious physical illnesses affected marriages. They found that, overall, 31% of marriages ended in divorce over the period studied. The incidence of new <v>chronic</v> illness onset increased over time as well, with <b class="pass-kw">more husbands than wives developing serious health problems</b>.',
    hint: '📍 Q47 在此：定位句 "more husbands than wives developing serious health problems" → D 选项 "比妻子更容易得重病"',
  },
  {
    label: 'P5', loc: [48],
    raw: '"We found that women are doubly <v>vulnerable</v> to <v>marital</v> break-up in the face of illness," Karraker said. "They\'re more likely to be <v>widowed</v>, and if they\'re the ones who become ill, they\'re <b class="pass-kw">more likely to get divorced</b>."',
    hint: '📍 Q48 在此：定位句 "more likely to get divorced" → 生病女性更容易被离婚',
  },
  {
    label: 'P6', loc: [49],
    raw: 'While the study didn\'t assess why divorce is more likely when wives but not husbands become seriously ill, Karraker offers a few possible reasons. "Gender <v>norms</v> and social expectations about <v>caregiving</v> <b class="pass-kw">may make it more difficult for men to provide care</b> to sick spouses," Karraker said. And because of the imbalance in marriage markets, especially in older ages, divorced men have more choices among <v>prospective</v> partners than divorced women.',
    hint: '📍 Q49 在此："性别准则和社会期望使得男性更难照顾生病的配偶" → 男性更习惯于接受照顾（A选项）',
  },
  {
    label: 'P7', loc: [],
    raw: 'Given the increasing concern about health care costs for the aging population, Karraker believes <v>policymakers</v> should be aware of the relationship between disease and risk of divorce.',
  },
  {
    label: 'P8', loc: [50],
    raw: '"Offering support services to spouses caring for their other halves may reduce marital stress and prevent divorce at older ages," she said. "But <b class="pass-kw">it\'s also important to recognize</b> that the pressure to divorce may be health-related and that <b class="pass-kw">sick ex-wives may need additional care and services</b> to prevent worsening health and increased health costs."',
    hint: '📍 Q50 在此：定位句 "sick ex-wives may need additional care and services" → C 选项 "给离婚女性提供额外照顾"',
  },
];

// ===== 题目数据 =====
const questions = [
  {
    num: 46, locate: '定位 P1',
    stem: 'What can we learn about <b>marriage vows</b> from the passage?',
    keywords: ['marriage vows', 'guarantee', 'risk of divorce'],
    diff: '<b>核心差异：</b>A 说"不能保证"（对应文中 "risk of divorce rises"），B 说"跟以前一样有约束力"（与文中转折矛盾），C 说"不再被重视"（过度推断），D 说"能帮助渡过难关"（与文意相反）。<br>📌 <b>定位 P1：</b>首句说誓约承诺"无论生病健康都在一起"，但第二句立即转折 But... 指出离婚风险上升 → <b>誓约不能保证婚姻持久。</b>',
    answer: 0,
    options: ['A) They may not guarantee a lasting marriage.', 'B) They are as binding as they used to be.', 'C) They are not taken seriously any more.', 'D) They may help couples tide over hard times.']
  },
  {
    num: 47, locate: '定位 P4',
    stem: 'What did Karraker and co-author Kenzie Latham find about <b>elderly husbands</b>?',
    keywords: ['elderly husbands', 'serious illnesses', 'more than wives'],
    diff: '<b>核心差异：</b>A 说照顾不好自己（无关），B 说越来越容易生病（不是"越来越"），C 说跟妻子一样得各种病（未提及），D 说<b>比妻子更容易得重病</b>。<br>📌 <b>定位 P4 末句：</b>"more husbands than wives developing serious health problems" → 丈夫比妻子更多患上严重健康问题。',
    answer: 3,
    options: ['A) They are generally not good at taking care of themselves.', 'B) They can become increasingly vulnerable to serious illnesses.', 'C) They can develop different kinds of illnesses just like their wives.', 'D) They are more likely to contract serious illnesses than their wives.']
  },
  {
    num: 48, locate: '定位 P5',
    stem: 'What does Karraker say about <b>women who fall ill</b>?',
    keywords: ['women who fall ill', 'get divorced', 'more likely'],
    diff: '<b>核心差异：</b>注意区分"丧偶（widowed）"和"离婚（divorced）"！A 说丧偶（文中确实提到但非重点），B 说<b>被离婚</b>（定位句直接说 "more likely to get divorced"），C 和 D 文中未明确提及。<br>📌 <b>定位 P5：</b>"more likely to get divorced" → 女性病了更容易被离婚。',
    answer: 1,
    options: ['A) They are more likely to be widowed.', 'B) They are more likely to get divorced.', 'C) They are less likely to receive good care.', 'D) They are less likely to bother their spouses.']
  },
  {
    num: 49, locate: '定位 P6',
    stem: 'Why is it more difficult for <b>men to take care</b> of their sick spouses?',
    keywords: ['more difficult for men', 'provide care', 'gender norms'],
    diff: '<b>核心差异：</b>A 说"更习惯接受照顾"（性别规范导致），B/C/D 文中均未提及。<br>📌 <b>定位 P6：</b>"Gender norms and social expectations about caregiving may make it more difficult for men to provide care" → 性别准则使得男性<b>更习惯于接受照顾</b>而非提供照顾。',
    answer: 0,
    options: ['A) They are more accustomed to receiving care.', 'B) They find it more important to make money for the family.', 'C) They think it more urgent to fulfill their social obligations.', 'D) They expect society to do more of the job.']
  },
  {
    num: 50, locate: '定位 P8',
    stem: 'What does Karraker think is <b>also important</b>?',
    keywords: ['also important', 'additional care', 'ex-wives'],
    diff: '<b>核心差异：</b>A 说减轻妻子压力（不是定位句内容），B 说稳定关系（未提及），C 说<b>给离婚女性提供额外照顾</b>，D 说让男性支付（未提及）。<br>📌 <b>定位 P8 末句：</b>"sick ex-wives may need additional care and services" → 对应 C 选项 "divorced women → extra care"。',
    answer: 2,
    options: ['A) Reducing marital stress on wives.', 'B) Stabilizing old couples\' relations.', 'C) Providing extra care for divorced women.', 'D) Making men pay for their wives\' health costs.']
  },
];

let currentQ = -1;
let wordOpen = null;

// ===== 渲染文章 =====
function renderPassage() {
  const container = document.getElementById('passage');
  container.innerHTML = passages.map((p, i) => {
    let text = p.raw;
    text = text.replace(/<v>(.*?)<\/v>/g, (_, word) =>
      `<span class="word-badge" onclick="event.stopPropagation();openWord('${word}')">${word}</span>`
    );
    const hint = p.hint ? `<div class="para-hint">${p.hint}</div>` : '';
    return `<div class="para" id="p-${i}">
      <span class="para-label">${p.label}</span> ${text}
      ${hint}
    </div>`;
  }).join('');

  // 分页点
  const dots = document.getElementById('pz-dots');
  dots.innerHTML = passages.map(() => `<span class="pzd"></span>`).join('');
  document.getElementById('pz-num').textContent = '1/1';
}

// ===== 渲染题目 =====
function renderQuestions() {
  const container = document.getElementById('questions');
  container.innerHTML = questions.map((q, i) => `
    <div class="q-card" id="q-${i}" onclick="selectQ(${i})">
      <div class="q-card-header">
        <span class="q-num">Q${q.num}</span>
        <span class="q-locate">${q.locate}</span>
      </div>
      <div class="q-stem">${q.stem}</div>
      <div class="q-keywords">${q.keywords.map(k => `<span class="q-kw">${k}</span>`).join('')}</div>
      <div class="q-diff">💡 <b>解题思路</b><br><br>${q.diff}</div>
      <div class="q-options" id="opts-${i}">
        ${q.options.map((o, j) => `<div class="q-opt" id="opt-${i}-${j}">${o}</div>`).join('')}
      </div>
    </div>
  `).join('');
}

// ===== 选择题号 =====
function selectQ(i) {
  // 清除旧状态
  document.querySelectorAll('.q-card.active').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.para.highlight').forEach(el => el.classList.remove('highlight'));
  document.querySelectorAll('.para.highlight2').forEach(el => el.classList.remove('highlight2'));

  const qCard = document.getElementById('q-' + i);
  if (currentQ === i) { currentQ = -1; return; }
  currentQ = i;
  qCard.classList.add('active');

  // 高亮定位段落
  const q = questions[i];
  passages.forEach((p, idx) => {
    if (p.loc.includes(q.num)) {
      const el = document.getElementById('p-' + idx);
      if (el) { el.classList.add('highlight'); el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
    }
  });

  // 滚动到题目
  qCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

// ===== 打开词汇弹窗 =====
function openWord(key) {
  const v = vocab[key];
  if (!v) return;
  document.getElementById('wm-en').textContent = key;
  document.getElementById('wm-phonetic').textContent = v.phonetic;
  document.getElementById('wm-zh').textContent = v.zh;
  document.getElementById('wm-note').textContent = v.note;
  document.getElementById('word-modal').classList.add('show');
}

function closeWordModal() {
  document.getElementById('word-modal').classList.remove('show');
}

// ===== 查看全部答案 =====
function showAllAnswers() {
  const list = document.getElementById('answer-list');
  list.innerHTML = questions.map(q => `
    <div class="as-item">
      Q${q.num} → <span class="as-correct">${q.options[q.answer].slice(0, 3)}</span>
      <span style="font-size:10px;color:#8a7a9a">${q.options[q.answer].slice(3)}</span>
    </div>
  `).join('');
  document.getElementById('answer-overlay').classList.add('show');
}

function closeAnswerOverlay() {
  document.getElementById('answer-overlay').classList.remove('show');
}

// ===== 提交批改 =====
function submitAll() {
  let html = '';
  questions.forEach((q, i) => {
    html += `<div class="as-item">
      Q${q.num} → <span class="as-correct">${q.options[q.answer].slice(0, 3)}</span> ${q.options[q.answer].slice(3)}
    </div>`;
  });
  document.getElementById('answer-list').innerHTML = html;
  document.getElementById('answer-overlay').classList.add('show');
}

// ===== 初始化 =====
renderPassage();
renderQuestions();
</script>
</body>
</html>
