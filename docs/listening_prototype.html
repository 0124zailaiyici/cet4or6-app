<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>听力真题原型</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #1a1a2e; font-family: -apple-system, sans-serif;
  display: flex; justify-content: center; align-items: center; min-height: 100vh;
  padding: 12px;
}
.phone {
  width: 375px; height: 780px; background: #f3eeed; border-radius: 40px;
  overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.2);
  display: flex; flex-direction: column; position: relative;
}

/* Header */
.header {
  display: flex; align-items: center; gap: 10px;
  padding: 16px 20px 6px; flex-shrink: 0;
}
.back {
  width: 56px; height: 56px; border-radius: 14px;
  background: rgba(33,150,243,0.08);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; color: #2196f3; cursor: pointer;
}
.header h1 { flex: 1; font-size: 17px; font-weight: 700; color: #2d2d4e; }
.header .qcount {
  font-size: 12px; color: #8a7a9a; background: #fff; padding: 4px 12px;
  border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.04);
}

/* Audio Player */
.audio-player { padding: 6px 20px 2px; flex-shrink: 0; }
.progress { height: 8px; border-radius: 4px; background: #ece4e2; margin-bottom: 4px; position: relative; cursor: pointer; }
.progress .fill {
  height: 100%; border-radius: 4px;
  background: linear-gradient(90deg, #4fc3f7, #2196f3);
  width: 35%; transition: width 0.2s;
}
.progress .thumb {
  position: absolute; top: 50%; left: 35%; transform: translate(-50%, -50%);
  width: 20px; height: 20px; border-radius: 50%;
  background: #2196f3; box-shadow: 0 1px 6px rgba(33,150,243,0.4);
}
.time { display: flex; justify-content: space-between; font-size: 11px; color: #8a7a9a; }

/* Controls bar */
.controls { display: flex; gap: 6px; padding: 3px 20px 6px; flex-wrap: wrap; flex-shrink: 0; }
.controls .speed, .controls .ctrl {
  padding: 4px 14px; border-radius: 12px; font-size: 13px; color: #8a7a9a;
  background: #fff0f3; border: 1px solid transparent; cursor: pointer;
}
.controls .speed.active, .controls .ctrl.active {
  color: #2196f3; background: rgba(33,150,243,0.08); border-color: rgba(33,150,243,0.2);
}

/* Swipe Area */
.swipe-area { flex: 1; padding: 0 12px 6px; min-height: 0; overflow: hidden; }
.swipe-view {
  height: 100%; overflow: hidden; position: relative;
  border-radius: 16px; background: #fff;
  box-shadow: 0 2px 12px rgba(33,150,243,0.04);
}
.swipe-track { display: flex; height: 100%; transition: transform 0.3s ease; }
.swipe-card {
  min-width: 100%; height: 100%; overflow-y: auto;
  padding: 16px 20px;
}

/* Question Card */
.q-section {
  font-size: 11px; color: #2196f3; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.5px; margin-bottom: 6px;
}
.q-stem {
  font-size: 15px; font-weight: 600; color: #2d2d4e; line-height: 1.6;
  margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid #f5f0f0;
}
.q-opts { display: flex; flex-direction: column; gap: 8px; }
.qo {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 14px 16px; border-radius: 14px;
  font-size: 14px; color: #4a4a6a; line-height: 1.5;
  background: #f8f5f4; border: 2px solid #ece4e2; cursor: pointer;
  transition: 0.15s;
}
.qo .ql {
  width: 28px; height: 28px; border-radius: 8px;
  background: rgba(84,110,122,0.06); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; color: #8a7a9a;
}
.qo .qt { flex: 1; }
.qo.on {
  color: #1e88e5; font-weight: 600;
  border-color: #1e88e5;
  background: rgba(30,136,229,0.04);
  box-shadow: 0 1px 8px rgba(30,136,229,0.1);
}
.qo.on .ql {
  background: #1e88e5; color: #fff;
}

/* Dir Page */
.dir-page { display: flex; flex-direction: column; }
.dir-label { font-size: 13px; font-weight: 700; color: #2196f3; margin-bottom: 10px; }
.dir-text { font-size: 14px; line-height: 1.7; color: #4a4a6a; }
.dir-nav { margin-top: auto; padding-top: 12px; }
.dir-btn {
  display: block; width: 100%; padding: 14px; border-radius: 14px;
  background: linear-gradient(135deg, #4fc3f7, #2196f3); color: #fff;
  text-align: center; font-size: 15px; font-weight: 600; cursor: pointer;
  box-shadow: 0 4px 12px rgba(33,150,243,0.2);
}

/* Bottom Bar */
.bottom-bar {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 12px 14px; flex-shrink: 0;
}
.b-prev, .b-next {
  height: 44px; border-radius: 10px; background: #fff0f3;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; color: #546e7a; font-weight: 600; cursor: pointer;
  flex: 0 0 auto; padding: 0 14px; white-space: nowrap;
}
.b-prev:active, .b-next:active { background: #ffe0e6; }
.b-play {
  width: 56px; height: 56px; border-radius: 50%;
  background: linear-gradient(135deg, #4fc3f7, #2196f3);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; color: #fff; cursor: pointer;
  box-shadow: 0 4px 16px rgba(33,150,243,0.3); flex-shrink: 0;
}
.b-dots { flex: 1; display: flex; justify-content: center; gap: 4px; overflow: hidden; }
.b-dot { min-width: 6px; height: 6px; border-radius: 50%; background: #d0c8d0; transition: 0.2s; }
.b-dot.on { min-width: 18px; border-radius: 3px; background: #546e7a; }

/* scrollbar */
.swipe-view ::-webkit-scrollbar { width: 3px; }
.swipe-view ::-webkit-scrollbar-thumb { background: #d0c8d0; border-radius: 2px; }
</style>
</head>
<body>
<div class="phone" id="app">
  <!-- Header -->
  <div class="header">
    <div class="back">←</div>
    <h1>CET-4 听力 2019061</h1>
    <div class="qcount" id="qcount">1/25</div>
  </div>

  <!-- Audio Player -->
  <div class="audio-player">
    <div class="progress" id="progressBar">
      <div class="fill" id="progressFill"></div>
      <div class="thumb" id="progressThumb"></div>
    </div>
    <div class="time">
      <span id="currentTime">0:00</span>
      <span id="totalTime">28:30</span>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <div class="speed" data-speed="0.5">0.5x</div>
    <div class="speed active" data-speed="1">1x</div>
    <div class="speed" data-speed="1.25">1.25x</div>
    <div class="speed" data-speed="1.5">1.5x</div>
    <div class="ctrl" id="loopBtn">循环</div>
    <div class="ctrl" id="markBtn" style="color:#ff6b8a">标记</div>
  </div>

  <!-- Swipe Area -->
  <div class="swipe-area">
    <div class="swipe-view" id="swipeView">
      <div class="swipe-track" id="swipeTrack"></div>
    </div>
  </div>

  <!-- Bottom Bar -->
  <div class="bottom-bar">
    <div class="b-prev" id="prevBtn">⬅ 上一题</div>
    <div class="b-play" id="playBtn">▶</div>
    <div class="b-dots" id="dots"></div>
    <div class="b-next" id="nextBtn">下一题 ➔</div>
  </div>
</div>

<script>
// ====== DATA ======
const pages = [
  // Page 0: Directions
  { type: 'dir', section: 'Section A', text: `In this section, you will hear three news reports. At the end of each news report, you will hear two or three questions. Both the news report and the questions will be spoken only once. After you hear a question, you must choose the best answer from the four choices marked A), B), C) and D). Then mark the corresponding letter on Answer Sheet 1 with a single line through the centre.` },
  // Q1
  { type: 'q', section: 'News Report 1', stem: 'Q1. What did the boy do to celebrate his ninth birthday?', opts: [
    'He set a record by swimming to and from an island.',
    'He celebrated his ninth birthday on a small island.',
    'He visited a prison located on a faraway island.',
    'He swam around an island near San Francisco.'
  ]},
  // Q2
  { type: 'q', section: 'News Report 1', stem: 'Q2. What did the father do for the boy?', opts: [
    'He doubled the reward.',
    'He set him an example.',
    'He cheered him on all the way.',
    'He had the event covered on TV.'
  ]},
  // Q3
  { type: 'q', section: 'News Report 2', stem: 'Q3. What new policy did the country introduce?', opts: [
    'To end the one-child policy.',
    'To encourage late marriage.',
    'To increase working efficiency.',
    'To give people more time to travel.'
  ]},
  // Q4
  { type: 'q', section: 'News Report 2', stem: 'Q4. How do young people respond to the new policy?', opts: [
    'They will not be welcomed by young people.',
    'They will help to popularize early marriage.',
    'They will boost China\'s tourism industry.',
    'They will cause more social problems.'
  ]},
  // Q5
  { type: 'q', section: 'News Report 3', stem: 'Q5. What is the news report mainly about?', opts: [
    'A massive wildfire in California.',
    'A new species of fish discovered.',
    'A successful space mission.',
    'A breakthrough in medical research.'
  ]},
  // Q6
  { type: 'q', section: 'News Report 3', stem: 'Q6. How many people were affected by the incident?', opts: [
    'Approximately 200.',
    'More than 1,000.',
    'Nearly 5,000.',
    'Over 10,000.'
  ]},
  // Q7
  { type: 'q', section: 'News Report 3', stem: 'Q7. What measure has been taken to address the situation?', opts: [
    'Evacuation orders have been issued.',
    'Emergency funds have been allocated.',
    'International aid has been requested.',
    'Volunteers have been recruited.'
  ]},
  // Page: Section B directions
  { type: 'dir', section: 'Section B - Conversation', text: `In this section, you will hear two long conversations. At the end of each conversation, you will hear four questions. Both the conversation and the questions will be spoken only once. After you hear a question, you must choose the best answer from the four choices marked A), B), C) and D).` },
  // Q8
  { type: 'q', section: 'Conversation 1', stem: 'Q8. What did the man do last week?', opts: [
    'He had a driving lesson.',
    'He got his driver\'s license.',
    'He took the driver\'s theory exam.',
    'He passed the driver\'s road test.'
  ]},
  // Q9
  { type: 'q', section: 'Conversation 1', stem: 'Q9. Why did the man fail the test?', opts: [
    'He was not well prepared.',
    'He did not get to the exam in time.',
    'He was not used to the test format.',
    'He did not follow the test procedure.'
  ]},
  // Q10
  { type: 'q', section: 'Conversation 1', stem: 'Q10. What does the woman suggest about the driving tests?', opts: [
    'They are tough.',
    'They are costly.',
    'They are helpful.',
    'They are too short.'
  ]},
  // Q11
  { type: 'q', section: 'Conversation 1', stem: 'Q11. What does the man plan to do next?', opts: [
    'Pass his road test the first time.',
    'Test-drive a few times on highways.',
    'Find an experienced driving instructor.',
    'Earn enough money for driving lessons.'
  ]},
  // Q12
  { type: 'q', section: 'Conversation 2', stem: 'Q12. What are the speakers mainly discussing?', opts: [
    'Where the woman studies.',
    'The acceptance rate at Leeds.',
    'Leeds\' tuition for international students.',
    'How to apply for studies at a university.'
  ]},
  // Q13
  { type: 'q', section: 'Conversation 2', stem: 'Q13. What is the woman planning to do?', opts: [
    'Apply to an American university.',
    'Do research on higher education.',
    'Perform in a famous musical.',
    'Pursue postgraduate studies.'
  ]},
  // Q14
  { type: 'q', section: 'Conversation 2', stem: 'Q14. What helped the woman get the scholarship?', opts: [
    'His favorable recommendations.',
    'His outstanding musical talent.',
    'His academic excellence.',
    'His unique experience.'
  ]},
  // Q15
  { type: 'q', section: 'Conversation 2', stem: 'Q15. What is the woman\'s future plan?', opts: [
    'Do a master\'s degree.',
    'Settle down in England.',
    'Travel widely.',
    'Teach overseas.'
  ]},
  // Page: Section C directions
  { type: 'dir', section: 'Section C - Passages', text: `In this section, you will hear three passages. At the end of each passage, you will hear three or four questions. Both the passage and the questions will be spoken only once. After you hear a question, you must choose the best answer from the four choices marked A), B), C) and D).` },
  // Q16
  { type: 'q', section: 'Passage 1', stem: 'Q16. What do we learn about ants from the passage?', opts: [
    'They help farmers keep diseases in check.',
    'Many species remain unknown to scientists.',
    'Only a few species cause trouble to humans.',
    'They live in incredibly well-organized colonies.'
  ]},
  // Q17
  { type: 'q', section: 'Passage 1', stem: 'Q17. What is special about carpenter ants?', opts: [
    'They are larger than many other species.',
    'They can cause damage to people\'s homes.',
    'They can survive a long time without water.',
    'They like to form colonies in electrical units.'
  ]},
  // Q18
  { type: 'q', section: 'Passage 1', stem: 'Q18. What does the passage suggest to control ants?', opts: [
    'Deny them access to any food.',
    'Keep doors and windows shut.',
    'Destroy their colonies close by.',
    'Refrain from eating sugary food.'
  ]},
  // Q19
  { type: 'q', section: 'Passage 2', stem: 'Q19. What is the passage mainly about?', opts: [
    'The function of the human immune system.',
    'The cause of various auto-immune diseases.',
    'The viruses that may infect the human immune system.',
    'The change in people\'s immune system as they get older.'
  ]},
  // Q20
  { type: 'q', section: 'Passage 2', stem: 'Q20. What did the researchers ask the participants to do?', opts: [
    'Report their illnesses.',
    'Offer blood samples.',
    'Act as research assistants.',
    'Help to interview patients.'
  ]},
  // Q21
  { type: 'q', section: 'Passage 2', stem: 'Q21. What did the study find about the immune system?', opts: [
    'Strengthening people\'s immunity to infection.',
    'Better understanding patients\' immune system.',
    'Helping improve old people\'s health conditions.',
    'Further reducing old patients\' medical expenses.'
  ]},
  // Q22
  { type: 'q', section: 'Passage 3', stem: 'Q22. What problem did the teacher notice in his class?', opts: [
    'His students had trouble getting on with each other.',
    'A lot of kids stayed at school to do their homework.',
    'His students were struggling to follow his lessons.',
    'A group of kids were playing chess after school.'
  ]},
  // Q23
  { type: 'q', section: 'Passage 3', stem: 'Q23. What did the students want to do?', opts: [
    'Visit a chess team in Nashville.',
    'Join the school\'s chess team.',
    'Participate in a national chess competition.',
    'Receive training for a chess competition.'
  ]},
  // Q24
  { type: 'q', section: 'Passage 3', stem: 'Q24. What happened to the students who played chess?', opts: [
    'Most of them come from low-income families.',
    'Many have become national chess champions.',
    'A couple of them have got involved in crimes.',
    'Many became chess coaches after graduation.'
  ]},
  // Q25
  { type: 'q', section: 'Passage 3', stem: 'Q25. What message does the passage convey?', opts: [
    'Actions speak louder than words.',
    'Think twice before taking action.',
    'Translate their words into action.',
    'Take action before it gets too late.'
  ]},
]

const letters = ['A', 'B', 'C', 'D']
let cur = 0
let playing = false
let answers = {}
const track = document.getElementById('swipeTrack')
const dotsEl = document.getElementById('dots')

// Render
function render() {
  track.innerHTML = ''
  dotsEl.innerHTML = ''
  pages.forEach((p, i) => {
    const card = document.createElement('div')
    card.className = 'swipe-card'

    if (p.type === 'dir') {
      card.innerHTML = `
        <div class="dir-page">
          <div class="dir-label">${p.section}</div>
          <div class="dir-text">${p.text}</div>
          <div class="dir-nav">
            <div class="dir-btn" data-i="${i + 1}">开始答题 →</div>
          </div>
        </div>`
    } else {
      let optsHtml = ''
      p.opts.forEach((o, j) => {
        const isOn = answers[i] === j ? ' on' : ''
        optsHtml += `<div class="qo${isOn}" data-i="${i}" data-oi="${j}">
          <div class="ql">${letters[j]}</div>
          <div class="qt">${o}</div>
        </div>`
      })
      card.innerHTML = `
        <div class="q-section">${p.section}</div>
        <div class="q-stem">${p.stem}</div>
        <div class="q-opts">${optsHtml}</div>`
    }

    track.appendChild(card)

    const dot = document.createElement('div')
    dot.className = 'b-dot' + (i === 0 ? ' on' : '')
    dotsEl.appendChild(dot)
  })
  updatePos()
}

render()

// Swipe
const view = document.getElementById('swipeView')
let startX = 0
view.addEventListener('touchstart', e => startX = e.touches[0].clientX)
view.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - startX
  if (dx > 50) goTo(cur - 1)
  else if (dx < -50) goTo(cur + 1)
})

function goTo(i) {
  if (i < 0 || i >= pages.length) return
  cur = i
  updatePos()
}

function updatePos() {
  track.style.transform = `translateX(-${cur * 100}%)`
  document.getElementById('qcount').textContent = `${cur + 1}/${pages.length}`
  document.querySelectorAll('.b-dot').forEach((d, j) => {
    d.className = 'b-dot' + (j === cur ? ' on' : '')
  })
}

// Option click
track.addEventListener('click', function(e) {
  const qo = e.target.closest('.qo')
  if (!qo) return
  const i = parseInt(qo.dataset.i)
  const oi = parseInt(qo.dataset.oi)
  answers[i] = answers[i] === oi ? undefined : oi
  // Re-render current card
  const cards = track.querySelectorAll('.swipe-card')
  const card = cards[i]
  const opts = card.querySelectorAll('.qo')
  opts.forEach((o, j) => {
    o.className = 'qo' + (answers[i] === j ? ' on' : '')
  })
})

// Dir button
track.addEventListener('click', function(e) {
  const btn = e.target.closest('.dir-btn')
  if (btn) goTo(parseInt(btn.dataset.i))
})

// Prev/Next
document.getElementById('prevBtn').addEventListener('click', () => goTo(cur - 1))
document.getElementById('nextBtn').addEventListener('click', () => goTo(cur + 1))

// Play
document.getElementById('playBtn').addEventListener('click', function() {
  playing = !playing
  this.textContent = playing ? '⏸' : '▶'
})

// Speed
document.querySelectorAll('.speed').forEach(el => {
  el.addEventListener('click', function() {
    document.querySelectorAll('.speed').forEach(s => s.classList.remove('active'))
    this.classList.add('active')
  })
})

// Keyboard
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') goTo(cur - 1)
  if (e.key === 'ArrowRight') goTo(cur + 1)
})
</script>
</body>
</html>
