<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>单词本 · 故事+挑战+卡包</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f3eeed;color:#2d2d4e;min-height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:420px;min-height:100vh;display:flex;flex-direction:column;padding-bottom:80px}

.tb{padding:36px 20px 14px;background:linear-gradient(135deg,#ffb3c6,#ff8fab);color:#fff}
.tb .tt{font-size:20px;font-weight:800}
.tb .sub{font-size:13px;opacity:.85;margin-top:2px}

/* main nav */
.nav{display:flex;gap:4px;margin:10px 14px 6px}
.nav-item{flex:1;text-align:center;padding:10px 0;font-size:13px;color:#8a7a9a;background:#fff;border-radius:10px;cursor:pointer;transition:.2s;border:1px solid transparent}
.nav-item.on{color:#ff6b8a;font-weight:600;background:rgba(255,107,138,.06);border-color:rgba(255,107,138,.2)}

/* stats */
.stats{display:flex;gap:6px;margin:0 14px 10px}
.st{flex:1;background:#fff;border-radius:10px;padding:10px;text-align:center}
.st .n{display:block;font-size:24px;font-weight:800;color:#ff6b8a}
.st .n.g{color:#388e3c}
.st .n.b{color:#1e88e5}
.st .l{display:block;font-size:11px;color:#8a7a9a;margin-top:2px}

/* daily challenge */
.challenge-card{background:#fff;border-radius:16px;margin:0 14px 12px;padding:20px;box-shadow:0 2px 12px rgba(255,158,181,.04);display:flex;align-items:center;gap:14px}
.challenge-card .icon{font-size:40px;flex-shrink:0}
.challenge-card .info{flex:1}
.challenge-card .info .t{font-size:15px;font-weight:700;color:#2d2d4e}
.challenge-card .info .s{font-size:12px;color:#8a7a9a;margin-top:2px}
.challenge-card .btn{padding:8px 24px;border-radius:12px;background:linear-gradient(135deg,#ff8fab,#ff6b8a);color:#fff;font-size:13px;font-weight:600;cursor:pointer;flex-shrink:0;border:none}
.challenge-card .btn.done{background:#e0e0e0;color:#999}
.challenge-card .badge{font-size:36px;flex-shrink:0}

/* content area */
.content{flex:1;padding:0 14px 20px;overflow-y:auto}

/* pack grid */
.pack-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pack{background:#fff;border-radius:14px;padding:16px;text-align:center;cursor:pointer;transition:.15s;box-shadow:0 1px 8px rgba(255,158,181,.04)}
.pack:active{transform:scale(.96)}
.pack .emoji{font-size:32px;margin-bottom:4px}
.pack .name{font-size:14px;font-weight:600;color:#2d2d4e}
.pack .count{font-size:11px;color:#8a7a9a;margin-top:2px}
.pack .bar{height:4px;border-radius:2px;background:#f0e8e7;margin-top:8px;overflow:hidden}
.pack .bar .fill{height:100%;border-radius:2px;background:linear-gradient(90deg,#ff8fab,#ff6b8a);transition:width .3s}
.pack.complete .bar .fill{background:linear-gradient(90deg,#66bb6a,#43a047)}
.pack .check{font-size:18px;color:#66bb6a;margin-top:4px;display:block}

/* pack detail */
.pack-detail{background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 12px rgba(255,158,181,.04)}
.pack-detail .ph{text-align:center;margin-bottom:14px}
.pack-detail .ph .e{font-size:36px;margin-bottom:4px}
.pack-detail .ph .n{font-size:16px;font-weight:700;color:#2d2d4e}
.pack-detail .ph .p{font-size:12px;color:#8a7a9a}
.pack-word{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f0e8e7}
.pack-word:last-child{border:none}
.pack-word .w{font-size:14px;font-weight:600;color:#2d2d4e;flex:1}
.pack-word .s{font-size:11px;color:#8a7a9a}
.pack-word .status{font-size:16px}
.pack-detail .back{padding:8px 20px;border-radius:10px;border:none;background:#f3eeed;color:#8a7a9a;font-size:13px;cursor:pointer;margin-bottom:12px}

/* story card */
.story-card{background:#fff;border-radius:16px;padding:24px;text-align:center;box-shadow:0 2px 12px rgba(255,158,181,.04)}
.story-card .lock{font-size:48px;margin-bottom:8px}
.story-card .sub{font-size:12px;color:#8a7a9a;margin-bottom:12px}
.story-card .text{font-size:16px;line-height:1.8;color:#2d2d4e;padding:16px;background:#f8f5f4;border-radius:12px;font-style:italic}
.story-card .progress{font-size:12px;color:#8a7a9a;margin-top:12px}
.story-list{margin-top:12px}
.story-item{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fff;border-radius:10px;margin-bottom:6px;font-size:13px}
.story-item .icon{font-size:18px}
.story-item .preview{flex:1;color:#2d2d4e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.story-item.locked .preview{color:#bbb}
.story-item .idx{color:#8a7a9a;font-size:11px}

/* overlay */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0);z-index:100;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .3s,background .3s}
.overlay.show{background:rgba(0,0,0,.5);pointer-events:auto;opacity:1}

/* flip for game (reused) */
.flip-ctn{width:320px;min-height:420px;perspective:800px}
.flip-inner{width:100%;min-height:420px;transition:transform .5s cubic-bezier(.4,.0,.2,1);transform-style:preserve-3d}
.flip-inner.flipped{transform:rotateY(180deg)}
.fr,.fb{position:absolute;inset:0;backface-visibility:hidden;background:#fff;border-radius:32px;padding:28px 30px 24px;display:flex;flex-direction:column;align-items:center;text-align:center;box-shadow:0 16px 60px rgba(0,0,0,.12)}
.fb{transform:rotateY(180deg)}
.gtop{display:flex;justify-content:space-between;width:100%;margin-bottom:10px}
.gprog{font-size:11px;color:#8a7a9a}
.gclose{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;color:#8a7a9a;background:rgba(0,0,0,.04);cursor:pointer}
.gw{font-size:32px;font-weight:800;color:#2d2d4e}
.gp{font-size:12px;color:#8a7a9a;margin:4px 0 8px}
.gctx{font-size:12px;color:#4a4a6a;padding:10px;background:#f8f5f4;border-radius:10px;width:100%;margin-bottom:6px}
.gb{padding:8px 24px;border-radius:16px;font-size:13px;font-weight:600;cursor:pointer;border:none;margin:4px}
.gb.known{background:#66bb6a;color:#fff}
.gb.hard{background:rgba(255,107,138,.1);color:#ff6b8a}
.gacts{margin-top:auto;padding-top:10px}
.ghint{font-size:11px;color:#ff6b8a;margin-top:6px}

/* story unlock popup */
.story-popup{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .5s}
.story-popup.show{opacity:1;pointer-events:auto}
.story-popup .box{background:#fff;border-radius:24px;padding:32px 28px;text-align:center;max-width:340px;box-shadow:0 20rpx 80rpx rgba(0,0,0,.15);animation:popIn .4s ease-out}
@keyframes popIn{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.story-popup .icon{font-size:48px;margin-bottom:8px;display:block}
.story-popup .title{font-size:16px;font-weight:700;color:#2d2d4e;margin-bottom:4px}
.story-popup .s-text{font-size:15px;line-height:1.8;color:#555;padding:16px;background:#f8f5f4;border-radius:12px;margin:10px 0;font-style:italic}
.story-popup .s-sub{font-size:11px;color:#8a7a9a}
.story-popup .btn{margin-top:14px;padding:10px 32px;border-radius:14px;background:linear-gradient(135deg,#ff8fab,#ff6b8a);color:#fff;font-size:14px;font-weight:600;border:none;cursor:pointer}

/* badge unlock popup */
.badge-popup{position:fixed;inset:0;z-index:201;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .5s}
.badge-popup.show{opacity:1;pointer-events:auto}
.badge-popup .box{background:#fff;border-radius:24px;padding:36px 32px;text-align:center;box-shadow:0 16px 60px rgba(0,0,0,.15);animation:popIn .4s ease-out}
.badge-popup .badge{font-size:64px;margin-bottom:8px;display:block}
.badge-popup .title{font-size:18px;font-weight:700;color:#2d2d4e}
.badge-popup .sub{font-size:12px;color:#8a7a9a;margin-top:4px}
.badge-popup .btn{margin-top:16px;padding:10px 32px;border-radius:14px;background:linear-gradient(135deg,#ff8fab,#ff6b8a);color:#fff;font-size:14px;font-weight:600;border:none;cursor:pointer}

/* dark mode toggle */
.dark-toggle{position:fixed;top:12px;right:12px;z-index:50;width:36px;height:36px;border-radius:50%;border:none;background:rgba(0,0,0,.06);color:#8a7a9a;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
body.dark .dark-toggle{background:rgba(255,255,255,.08);color:#a090b0}
body.dark{background:#12121f;color:#e0d0e8}
body.dark .tb{background:linear-gradient(135deg,#2a2a4a,#1a1a38)}
body.dark .nav-item,.dark .pack,.dark .challenge-card,.dark .story-card,.dark .pack-detail,.dark .story-item,.dark .fr,.dark .fb,.dark .story-popup .box,.dark .badge-popup .box{background:#1e1e38}
body.dark .nav-item.on{color:#ff8fab;background:rgba(255,143,171,.08);border-color:rgba(255,143,171,.2)}
body.dark .st,.dark .pack .bar{background:#1a1a30}
body.dark .story-card .text,.dark .story-popup .s-text,.dark .gctx{background:#2a2a4a;color:#c0b0d0}
body.dark .pack-word{border-color:#2a2a4a}
body.dark .gclose{background:rgba(255,255,255,.06);color:#6a6a8a}
body.dark .gw,.dark .pack .name,.dark .pack-word .w{color:#e0d0e8}
body.dark .gp{color:#a090b0}
body.dark .story-item.locked .preview{color:#555}
</style>
</head>

<div class="app">
  <div class="tb">
    <div class="tt">📖 单词本</div>

  </div>

  <div class="nav">
    <div class="nav-item on" onclick="switchNav('pack')">🎴 卡包</div>

</div>

<div class="story-popup" id="storyPopup">

</div>

<!-- 徽章弹出 -->
<div class="badge-popup" id="badgePopup">

    <span class="badge" id="badgeEmoji">🏅</span>

    <div class="sub" id="badgeSub">连续 1 天打卡</div>
    <div class="btn" onclick="closeBadgePopup()">太棒了 🎉</div>
  </div>
</div>

// ===== 状态 =====
let nav = 'pack'
// 每个词的掌握状态
let wordStates = {}
GAME_WORDS.forEach(w => { wordStates[w.word] = {correctStreak:0, status:'new', growth:0, stars:0, collected: false} })
// 卡包状态
let packProgress = {}
PACKS.forEach(p => { packProgress[p.id] = 0 })
// 故事
let unlockedStories = 0
// 每日挑战
let challengeDone = false
let challengeStreak = 0

// ===== 初始化 =====
// 模拟已有进度
wordStates['abandon'].collected = true; packProgress['school'] = 1
wordStates['campus'].collected = true; packProgress['school'] = 2
wordStates['absorb'].collected = true; packProgress['nature'] = 1
wordStates['access'].collected = true; packProgress['tech'] = 1
wordStates['embrace'].collected = true
wordStates['discover'].collected = true
wordStates['imagine'].collected = true
unlockedStories = 1

function render() {
  // stats
  const total = Object.values(wordStates).filter((v:any) => v.collected).length
  document.getElementById('totalWords').textContent = total
  const packsComplete = PACKS.filter(p => packProgress[p.id] >= p.words.length).length
  document.getElementById('packsDone').textContent = packsComplete
  document.getElementById('storiesUnlocked').textContent = unlockedStories

  // 每日挑战
  const banner = document.getElementById('challengeBanner')
  const btnArea = document.getElementById('challengeBtnArea')
  if (nav === 'challenge') {
    banner.style.display = 'flex'
    if (challengeDone) {
      document.getElementById('challengeTitle').textContent = '✅ 今日已完成'
      document.getElementById('challengeSub').textContent = '连续 ' + challengeStreak + ' 天打卡'
      btnArea.innerHTML = '<span class="badge">🏅</span>'
    } else {
      document.getElementById('challengeTitle').textContent = '⚡ 今日挑战'
      document.getElementById('challengeSub').textContent = '完成 10 个词 · 点亮今日徽章'
      btnArea.innerHTML = '<button class="btn" onclick="startChallenge()">开始挑战</button>'
    }
  } else { banner.style.display = 'none' }

  if (nav === 'pack') renderPacks()
  else if (nav === 'challenge') renderChallenge()
  else if (nav === 'story') renderStories()
}

// ===== 卡包 =====
let selectedPack = null
function renderPacks() {
  const el = document.getElementById('content')
  if (selectedPack) { renderPackDetail(selectedPack); return }
  el.innerHTML = '<div class="pack-grid">' + PACKS.map(p => {
    const done = packProgress[p.id]
    const total = p.words.length
    const complete = done >= total
    return '<div class="pack ' + (complete?'complete':'') + '" onclick="selectedPack=\''+p.id+'\';render()">'
      + '<div class="emoji">' + p.emoji + '</div>'
      + '<div class="name">' + p.name + '</div>'
      + '<div class="count">' + done + '/' + total + (complete?' ✅':'') + '</div>'
      + '<div class="bar"><div class="fill" style="width:' + (done/total*100) + '%"></div></div>'
      + '</div>'
  }).join('') + '</div>'
}

function renderPackDetail(id) {
  const p = PACKS.find(x => x.id === id)
  if (!p) return
  const done = packProgress[id]
  const el = document.getElementById('content')
  el.innerHTML = '<div class="pack-detail">'
    + '<button class="back" onclick="selectedPack=null;render()">← 返回卡包</button>'
    + '<div class="ph"><div class="e">' + p.emoji + '</div><div class="n">' + p.name + '</div><div class="p">' + done + '/' + p.words.length + '</div></div>'
    + p.words.map(w => {
      const col = wordStates[w.w]?.collected
      return '<div class="pack-word">'
        + '<span class="w">' + w.w + '</span>'
        + '<span class="s">' + w.s + '</span>'
        + '<span class="status">' + (col ? '✅' : '🔒') + '</span>'
        + '</div>'
    }).join('') + '</div>'
}

// ===== 每日挑战 =====
function startChallenge() {
  const shuffled = [...GAME_WORDS].sort(() => Math.random() - .5).slice(0, 10)
  startGame(shuffled, () => {
    challengeDone = true
    challengeStreak++
    document.getElementById('badgeEmoji').textContent = '🏅'
    document.getElementById('badgeTitle').textContent = '🔥 今日挑战完成！'
    document.getElementById('badgeSub').textContent = '连续 ' + challengeStreak + ' 天打卡'
    document.getElementById('badgePopup').classList.add('show')
    render()
  })
}

function closeBadgePopup() { document.getElementById('badgePopup').classList.remove('show') }

// ===== 故事 =====
function renderStories() {
  const el = document.getElementById('content')
  el.innerHTML = '<div class="story-card">'
    + (unlockedStories > 0 ? '<div class="lock">💌</div>' : '<div class="lock">🔒</div>')
    + '<div class="sub">已解锁 ' + unlockedStories + '/' + STORIES.length + ' 章</div>'
    + (unlockedStories > 0 ? '<div class="text">"' + STORIES[unlockedStories-1].text + '"</div>' : '<div class="text" style="color:#bbb">完成背词即可解锁故事章节。</div>')
    + '<div class="progress">' + (unlockedStories > 0 ? '第 ' + unlockedStories + ' 章 · ' + STORIES[unlockedStories-1].title : '') + '</div>'
    + '</div>'
    + '<div class="story-list">'
    + STORIES.map((s,i) => {
      const unlocked = i < unlockedStories
      return '<div class="story-item ' + (unlocked?'':'locked') + '">'
        + '<span class="idx">' + (i+1) + '</span>'
        + '<span class="icon">' + (unlocked ? s.icon : '🔒') + '</span>'
        + '<span class="preview">' + (unlocked ? '第 ' + (i+1) + ' 章 · ' + s.title : '??') + '</span>'
        + '</div>'
    }).join('') + '</div>'
}

// ===== 导航 =====
function switchNav(n) {
  nav = n
  selectedPack = null
  document.querySelectorAll('.nav-item').forEach((el,i) => el.classList.toggle('on', ['pack','challenge','story'][i] === n))
  document.getElementById('subTitle').textContent = n === 'pack' ? '卡包 · 收集你的 CET-4 词库' : n === 'challenge' ? '每日挑战 · 点亮徽章' : '故事 · 每背完 10 词解锁一章'
  render()
}

// ===== 翻卡游戏（简化版，用于每日挑战） =====
function startGame(words, onComplete) {
  let idx = 0
  document.getElementById('overlay').classList.add('show')
  function show() {
    const w = words[idx]
    if (!w) { document.getElementById('overlay').classList.remove('show'); onComplete(); return }
    document.getElementById('flipInner').classList.remove('flipped')
    document.getElementById('gw').textContent = w.word
    document.getElementById('gp').textContent = w.phonetic || ''
    document.getElementById('gctx').textContent = w.context || ''
    document.getElementById('gprog').textContent = (idx+1) + '/' + words.length
  }
  window._gameNext = () => {
    idx++
    // 收集这个词
    wordStates[words[idx-1]?.word] ? wordStates[words[idx-1].word].collected = true : 0
    // 更新卡包进度
    for (const p of PACKS) {
      const found = p.words.find(x => x.w === words[idx-1]?.word)
      if (found && wordStates[found.w]?.collected && packProgress[p.id] < p.words.length) {
        packProgress[p.id]++
        // 检查卡包是否集齐
        if (packProgress[p.id] >= p.words.length) {
          // 集齐一包！解锁一个故事
          if (unlockedStories < STORIES.length) {
            unlockedStories++
            setTimeout(() => {
              document.getElementById('storyPopupTitle').textContent = '🎉 「' + p.name + '」集齐！'
              document.getElementById('storyPopupText').textContent = STORIES[unlockedStories-1].text
              document.getElementById('storyPopupSub').textContent = '第 ' + unlockedStories + ' 章 · ' + STORIES[unlockedStories-1].title
              document.getElementById('storyPopup').classList.add('show')
            }, 500)
          }
        }
      }
    }
    render()
    show()
  }
  show()
}

function closeStoryPopup() { document.getElementById('storyPopup').classList.remove('show') }

// ===== 覆写 overlay =====
document.body.insertAdjacentHTML('beforeend', '<div class="overlay" id="overlay"><div class="flip-ctn"><div class="flip-inner" id="flipInner"><div class="fr"><div class="gtop"><span class="gprog" id="gprog">0/0</span><span class="gclose" onclick="document.getElementById(\'overlay\').classList.remove(\'show\')">✕</span></div><div class="gw" id="gw"></div><div class="gp" id="gp"></div><div class="gctx" id="gctx"></div><div style="margin-top:20px"><button class="gb known" onclick="window._gameNext && window._gameNext()">✅ 认识 →</button></div><div class="ghint">点击认识即可收集</div></div></div></div></div>')

render()
</script>
